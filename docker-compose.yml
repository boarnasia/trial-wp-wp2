# wp2 (WordPress 6)
# 単体起動: このディレクトリで docker compose up -d（事前に docker network create wp-global-net）
# 一括起動: wp-main から include される。サービス名・ボリューム名は include 時の衝突を避けるためサイト接頭辞付き
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: wp2-db
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
  WORDPRESS_DB_USER: ${MYSQL_USER}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
  WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: ${WP_DEBUG:-1}
  WP_HOME: ${WP_HOME}
  WORDPRESS_CONFIG_EXTRA: "require_once '/usr/local/etc/wordpress/wp-config-proxy.php';"

x-wordpress-volumes: &wordpress-volumes
  - wp2-html:/var/www/html
  - ./wp-content:/var/www/html/wp-content
  - ./config/wp-config-proxy.php:/usr/local/etc/wordpress/wp-config-proxy.php:ro

services:
  wp2-db:
    image: mysql:8.0
    # 固定名にして、単体起動と一括起動で同じ DB ボリュームを二重に使うのを防ぐ
    container_name: wp2-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - wp2-db-data:/var/lib/mysql
    networks:
      - wp2-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wp2-wordpress:
    image: ${WP_IMAGE}
    container_name: wp2-wordpress
    restart: unless-stopped
    depends_on:
      wp2-db:
        condition: service_healthy
    environment: *wordpress-env
    volumes: *wordpress-volumes
    ports:
      - "127.0.0.1:${WP_DEBUG_PORT}:80"
    networks:
      - wp2-internal
      - wp-global-net

  wp2-cli:
    image: wordpress:cli
    profiles: [cli]
    # wordpress:cli (alpine) の www-data は uid 82 のため、apache イメージの www-data (33) に合わせる
    user: "33:33"
    depends_on:
      wp2-db:
        condition: service_healthy
    environment: *wordpress-env
    volumes: *wordpress-volumes
    networks:
      - wp2-internal

networks:
  wp2-internal:
  wp-global-net:
    external: true

volumes:
  # 単体起動と一括起動でプロジェクト名が変わってもデータを共有するため名前を固定する
  wp2-db-data:
    name: wp2-db-data
  wp2-html:
    name: wp2-html
